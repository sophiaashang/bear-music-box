/* ---------- 八音盒音色引擎 ----------
   曲子：巴赫《G弦上的咏叹调》（公版乐曲，乐谱转译自 Mutopia Project 公版 MIDI），旋律声部 + 低声部。
   音色：梳齿式。基频清亮，带一点非谐的高频分音，起音有一下拨片的轻响，再过一层小房间混响。
   行为：翻页不断；放完三遍后最后一遍发条慢慢走完；切到别的标签页自动停。 */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const MUSIC_SHIFT = 12;            // 梳齿比钢琴谱高一个八度
const MUSIC_BPM = 66;
const SPB = 60 / MUSIC_BPM;
const TUNE = (() => {
  const ev = [];
  MELODY.forEach(([b, m]) => ev.push({ b, m: m + MUSIC_SHIFT, v: Math.abs(b - Math.round(b)) < 0.01 ? 1.1 : 0.9, soft: false }));
  BASS.forEach(([b, m]) => ev.push({ b, m: m + MUSIC_SHIFT, v: 0.55, soft: true }));
  return ev.sort((x, y) => x.b - y.b);
})();
const mus = { on: false, timer: null, bus: null, t0: 0, i: 0, loop: 0, maxLoop: 3, endAt: 0, level: 0.9 };
let actx = null;

function soundOn(){ return localStorage.getItem('snd') !== '0'; }
function ensureCtx(){
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

const _noise = {};
function noiseBuffer(ctx){
  const k = ctx.sampleRate;
  if (!_noise[k]){
    const buf = ctx.createBuffer(1, Math.floor(k * 0.06), k), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    _noise[k] = buf;
  }
  return _noise[k];
}
function makeImpulse(ctx){
  if (ctx._ir) return ctx._ir;
  const rate = ctx.sampleRate, len = Math.floor(rate * 2.0), buf = ctx.createBuffer(2, len, rate);
  for (let c = 0; c < 2; c++){
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++){
      const x = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - x, 3.4) * Math.min(1, i / (rate * 0.006));
    }
  }
  return (ctx._ir = buf);
}
function buildBus(ctx, level){
  const input = ctx.createGain();
  const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 8000;
  const dry = ctx.createGain(); dry.gain.value = 0.85;
  const conv = ctx.createConvolver(); conv.buffer = makeImpulse(ctx);
  const damp = ctx.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 4200;
  const wet = ctx.createGain(); wet.gain.value = 0.4;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -20; comp.knee.value = 20; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.3;
  const master = ctx.createGain(); master.gain.value = level;
  input.connect(tone); tone.connect(dry); tone.connect(conv); conv.connect(damp); damp.connect(wet);
  dry.connect(comp); wet.connect(comp); comp.connect(master); master.connect(ctx.destination);
  return { input, master };
}

/* 拨片的一下轻响：很短的带通噪声 */
function pluck(ctx, out, t, vel){
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = noiseBuffer(ctx);
  f.type = 'bandpass'; f.frequency.value = 3800; f.Q.value = 1.2;
  g.gain.setValueAtTime(vel * 0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.018);
  s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + 0.03);
}
/* 一根梳齿：低音振得久，高音振得短；高频分音衰减很快 */
function tine(ctx, out, f, t, vel, soft){
  const dur = Math.max(0.5, 2.6 - Math.log2(f / 220) * 0.55);
  const parts = soft ? [[1, 1, 1], [2, 0.1, 0.4]] : [[1, 1, 1], [2, 0.14, 0.45], [6.27, 0.11, 0.12], [17.5, 0.03, 0.05]];
  const cents = (Math.random() - 0.5) * 6;
  parts.forEach(([r, a, dk]) => {
    const fr = f * r * Math.pow(2, cents / 1200);
    if (fr > 12000) return;
    const o = ctx.createOscillator(), g = ctx.createGain(), d = dur * dk;
    o.type = 'sine'; o.frequency.value = fr;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel * a * 0.22, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + d + 0.05);
  });
  pluck(ctx, out, t, soft ? vel * 0.5 : vel);
}
function playEv(ctx, out, e, t){ tine(ctx, out, mtof(e.m), t, e.v, e.soft); }

/* 发条的一声“嗒”：短噪声 + 低沉的木头共鸣 */
function ratchetClick(ctx, out, t, v){
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = noiseBuffer(ctx);
  f.type = 'bandpass'; f.frequency.value = 1500 + Math.random() * 400; f.Q.value = 3;
  g.gain.setValueAtTime(0.5 * v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
  s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + 0.05);
  const o = ctx.createOscillator(), og = ctx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(110, t + 0.04);
  og.gain.setValueAtTime(0.18 * v, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.connect(og); og.connect(out); o.start(t); o.stop(t + 0.07);
}
/* 拧发条：棘轮越拧越密 */
function windSound(){
  if (!soundOn()) return;
  try {
    const ctx = ensureCtx(), out = ctx.createGain();
    out.gain.value = 0.7; out.connect(ctx.destination);
    let t = ctx.currentTime + 0.05, gap = 0.17;
    for (let i = 0; i < 14; i++){ ratchetClick(ctx, out, t, i % 2 ? 0.8 : 1); t += gap; gap = Math.max(0.065, gap * 0.9); }
    ratchetClick(ctx, out, t + 0.05, 1.3);
  } catch (e) {}
}
/* 点小熊：单根梳齿的一声 */
const PING_NOTES = [86, 88, 90, 93, 95, 98];
function ping(){
  if (!soundOn()) return;
  try {
    const ctx = ensureCtx();
    ctx._ping = ctx._ping || buildBus(ctx, 0.75);
    tine(ctx, ctx._ping.input, mtof(PING_NOTES[Math.floor(Math.random() * PING_NOTES.length)]), ctx.currentTime + 0.02, 1, false);
  } catch (e) {}
}

/* 最后一遍：发条越走越慢 */
function tuneTime(b, rundown){ return rundown ? SPB * (b + 0.6 * b * b / MELODY_BEATS) : SPB * b; }
function musicTick(){
  if (!mus.on || !mus.bus) return;
  const ctx = actx, now = ctx.currentTime;
  for (let guard = 0; guard < 500; guard++){
    const last = mus.loop >= mus.maxLoop - 1;
    if (mus.i >= TUNE.length){
      if (last){ if (now > mus.endAt) finishTune(); return; }
      mus.loop++; mus.i = 0; mus.t0 += SPB * MELODY_BEATS + 2.2; continue;
    }
    const e = TUNE[mus.i], t = mus.t0 + tuneTime(e.b, mus.loop >= mus.maxLoop - 1);
    if (t > now + 1.2) break;
    if (t >= now - 0.08) playEv(ctx, mus.bus.input, e, Math.max(t, now));
    mus.endAt = Math.max(mus.endAt, t + 3);
    mus.i++;
  }
}
function finishTune(){
  clearInterval(mus.timer); mus.timer = null;
  if (mus.bus && actx) ratchetClick(actx, mus.bus.input, actx.currentTime + 0.05, 1.1);
  setTimeout(musicStop, 900);
}
function musicStart(){
  if (mus.on || !soundOn()) return;
  try {
    const ctx = ensureCtx();
    mus.bus = buildBus(ctx, 0.0001);
    mus.bus.master.gain.setTargetAtTime(mus.level, ctx.currentTime, 0.25);
    mus.on = true; mus.started = true; mus.i = 0; mus.loop = 0; mus.endAt = 0; mus.t0 = ctx.currentTime + 0.5;
    mus.timer = setInterval(musicTick, 160); musicTick(); syncBell();
  } catch (e) { mus.on = false; mus.bus = null; }
}
function musicStop(){
  mus.on = false; clearInterval(mus.timer); mus.timer = null;
  const b = mus.bus; mus.bus = null;
  if (b && actx){
    const t = actx.currentTime;
    b.master.gain.cancelScheduledValues(t); b.master.gain.setTargetAtTime(0, t, 0.06);
    setTimeout(() => { try { b.master.disconnect(); } catch (e) {} }, 500);
  }
  syncBell();
}
function setMusicLevel(l){
  mus.level = l;
  if (mus.bus && actx) mus.bus.master.gain.setTargetAtTime(l, actx.currentTime, 0.4);
}
function syncBell(){
  document.querySelectorAll('[data-bell]').forEach(b => { b.textContent = mus.on ? '🔔' : '🔕'; b.setAttribute('aria-pressed', mus.on ? 'true' : 'false'); });
}
function toggleMusic(){
  if (mus.on){ localStorage.setItem('snd', '0'); musicStop(); }
  else { localStorage.setItem('snd', '1'); musicStart(); }
  syncBell();
}
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('[data-bell]')) toggleMusic(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && mus.on) musicStop(); });
addEventListener('pagehide', () => { if (mus.on) musicStop(); });

        ${e['成本'] ? `<p><b>成本：</b>${esc(e['成本'])}</p>` : ''}
        ${e['收益'] ? `<p><b>依据：</b>${esc(e['收益'])}</p>` : ''}
        ${e['备注'] ? `<p><b>备注：</b>${esc(e['备注'])}</p>` : ''}
        <p><b>来源：</b>${linkify(e['来源'])}</p>
      </div></details>
    </article>`).join('')}
  </div>
  <div class="chat tail">${bubbles([s.tail], 0)}</div>
  <button class="next" id="next">再翻一页：${next.icon} ${esc(next.name)}</button>
  ${FOOTER}</div>`;

  bindAbout();
  $('#back').onclick = () => { location.hash = ''; };
  bindVig(id);
  $('#next').onclick = () => { location.hash = next.id; };
  $$('[data-share]').forEach(b => b.onclick = ev => share(s.entries[b.dataset.share], ev));
  const cards = $$('.reveal');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .08 });
    cards.forEach(c => io.observe(c));
  }
  setTimeout(() => cards.forEach(c => c.classList.add('in')), 2600);  // 兜底
  window.scrollTo(0, 0);
}
